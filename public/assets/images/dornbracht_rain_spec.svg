  <rect x="52" y="52" width="1096" height="696" fill="none" stroke="#B0C4DE" stroke-opacity="0.12" stroke-width="0.75" stroke-dasharray="4,4"/>
  
  <line x1="20" y1="40" x2="60" y2="40" stroke="#B0C4DE" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="40" y2="60" stroke="#B0C4DE" stroke-width="1.5"/>
  
  <line x1="1140" y1="40" x2="1180" y2="40" stroke="#B0C4DE" stroke-width="1.5"/>
  <line x1="1160" y1="20" x2="1160" y2="60" stroke="#B0C4DE" stroke-width="1.5"/>

