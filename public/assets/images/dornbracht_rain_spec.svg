  <!-- Technical Header -->
  <text x="80" y="90" font-family="monospace" font-size="13" fill="#B0C4DE" fill-opacity="0.9" letter-spacing="3">VAASTVIK DESIGN GROUP &bull; ARCHITECTURAL SPECIFICATION</text>
  <text x="80" y="115" font-family="monospace" font-size="11" fill="#B0C4DE" fill-opacity="0.6" letter-spacing="2">DRAWING REF: VDG-2026-SPEC &bull; SCALE 1:10 &bull; UNITS: MM</text>
  
  <!-- Title & Description -->
  <text x="80" y="180" font-family="Georgia, serif" font-size="38" font-weight="300" fill="#B0C4DE" letter-spacing="1">DORNBRACHT &bull; SENSORY SKY RAIN PANEL</text>
  <text x="80" y="215" font-family="monospace" font-size="13" fill="#B0C4DE" fill-opacity="0.75" letter-spacing="2">FIG 01 &bull; PLATINUM SATIN &amp; RECESSED CEILING CASCADE</text>

