<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_nrrxl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121418"/>
      <stop offset="100%" stop-color="#1A1E26"/>
    </linearGradient>
    <pattern id="grid_dwatt5" width="40" height="40" patternUnits="userSpaceOnUse">
