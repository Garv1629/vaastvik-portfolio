  <g transform="translate(600, 430)">
    <rect x="-300" y="-120" width="600" height="240" fill="none" stroke="#B0C4DE" stroke-width="2"/>
           <line x1="-300" y1="0" x2="300" y2="0" stroke="#B0C4DE" stroke-width="1" stroke-dasharray="6,6"/>
           <g stroke="#B0C4DE" stroke-width="1.5" stroke-opacity="0.7">
