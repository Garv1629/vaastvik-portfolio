  <text x="100" y="715" font-family="monospace" font-size="10" fill="#C0C0C0" fill-opacity="0.5" letter-spacing="1">FACTORY AUTHORIZED &bull; PASSES EN/ISO 9001 STRUCTURAL INTEGRITY STANDARDS</text>
