  <text x="80" y="215" font-family="monospace" font-size="13" fill="#C0C0C0" fill-opacity="0.75" letter-spacing="2">FIG 01 &bull; VINCENT VAN DUYSEN PVD GUNMETAL &amp; WALNUT</text>

