  <text x="80" y="90" font-family="monospace" font-size="13" fill="#C0C0C0" fill-opacity="0.9" letter-spacing="3">VAASTVIK DESIGN GROUP &bull; ARCHITECTURAL SPECIFICATION</text>
  <text x="80" y="115" font-family="monospace" font-size="11" fill="#C0C0C0" fill-opacity="0.6" letter-spacing="2">DRAWING REF: VDG-2026-SPEC &bull; SCALE 1:10 &bull; UNITS: MM</text>
  
  <!-- Title & Description -->
