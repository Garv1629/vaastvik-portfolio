<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1814"/>
      <stop offset="50%" stop-color="#12100E"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    
    <!-- Banana Gold Foil Gradient -->
    <linearGradient id="nanoBananaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="30%" stop-color="#F5B800"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>

    <radialGradient id="softLighting" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080706" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A241E"/>
      <stop offset="100%" stop-color="#171410"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#softLighting)"/>

  <!-- Blueprint Grid lines -->
  <g stroke="#D4AF37" stroke-opacity="0.1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="680" x2="1200" y2="680"/>
  </g>

  <!-- Central Display Pedestal -->
  <g transform="translate(450, 480)">
    <polygon points="0,0 300,0 260,180 40,180" fill="url(#pedestalGrad)" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="300" y2="0" stroke="#FFE066" stroke-opacity="0.6" stroke-width="2"/>
    <text x="150" y="100" font-family="serif" font-size="12" font-weight="600" fill="#D4AF37" letter-spacing="4" text-anchor="middle">TRAVERTINE PEDESTAL EST. 2026</text>
  </g>

  <!-- Nano Banana Sculpture Object -->
  <g transform="translate(600, 380)" filter="url(#glow)">
    <!-- Main Organic Curved Form of Nano Banana -->
    <path d="M -180,-40 C -100,-160 100,-170 180,-50 C 130,20 10,80 -100,50 C -150,30 -170,0 -180,-40 Z" 
          fill="url(#nanoBananaGold)" 
          stroke="#FFF099" 
          stroke-width="2"/>

    <!-- Stem Details -->
    <path d="M -180,-40 L -200,-55 C -205,-58 -202,-65 -195,-62 L -175,-48 Z" fill="#705510" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Fine Contour / Architectural Lines -->
    <path d="M -160,-35 C -90,-130 80,-140 155,-45" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6,4"/>
    <path d="M -140,-25 C -70,-90 60,-95 130,-35" fill="none" stroke="#FFE066" stroke-opacity="0.5" stroke-width="1"/>
    
    <!-- Accent Highlight Glow -->
    <ellipse cx="20" cy="-60" rx="90" ry="25" fill="#FFFFFF" fill-opacity="0.15" transform="rotate(-15)"/>
  </g>

  <!-- Architectural Typography & Frame Overlay -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="360" height="28" rx="4" fill="#D4AF37" fill-opacity="0.15" stroke="#D4AF37" stroke-width="1"/>
    <text x="16" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#FFE066" letter-spacing="3">MONOGRAPH 08 • ART INSTALLATION</text>
    <text x="0" y="90" font-family="serif" font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="4">NANO BANANA</text>
    <text x="0" y="130" font-family="serif" font-style="italic" font-size="24" fill="#D4AF37">Polished Brass &amp; Gold Architectural Sculpture</text>
    <line x1="0" y1="160" x2="440" y2="160" stroke="#D4AF37" stroke-width="2"/>
    
    <g transform="translate(0, 200)">
      <circle cx="8" cy="8" r="4" fill="#FFE066"/>
      <text x="24" y="12" font-family="sans-serif" font-size="15" fill="#E2E8F0">Mirror-Finished Brass Alloy</text>
      
      <circle cx="8" cy="52" r="4" fill="#FFE066"/>
      <text x="24" y="56" font-family="sans-serif" font-size="15" fill="#E2E8F0">Precision CNC Curved Geometry</text>
      
      <circle cx="8" cy="96" r="4" fill="#FFE066"/>
      <text x="24" y="100" font-family="sans-serif" font-size="15" fill="#E2E8F0">Integrated Micro LED Uplighting</text>
    </g>
  </g>

  <!-- Technical Footer -->
  <g transform="translate(100, 740)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#D4AF37" letter-spacing="2">VAASTVIK DESIGN GROUP &bull; NANO BANANA EDITION 2026</text>
  </g>
</svg>
